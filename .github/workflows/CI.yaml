name: CI

# Lint, format check, type check and tests on every PR to main. Malware Guard runs separately.

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imena
          POSTGRES_PASSWORD: imena
          POSTGRES_DB: imena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imena -d imena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://imena:imena@localhost:5432/imena_test
      DATABASE_URL_DIRECT: postgresql+psycopg://imena:imena@localhost:5432/imena_test
      TEST_DATABASE_URL: postgresql+psycopg://imena:imena@localhost:5432/imena_test
      ACCESS_TOKEN_SECRET: ci-access-token-secret-not-used-in-production
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs uv and the Python version from .python-version.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs the locked runtime and dev dependencies; fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # Strict type checking catches bad calls and wrong argument types that ruff can't see.
      - name: Type check
        run: uv run mypy src

      # Migrations apply to a fresh database, and the models have no changes without a migration.
      - name: Check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest
