[project]
name = "imenanewsbox-api"
version = "0.1.0"
description = "The API for the Imena News Box project."
readme = "README.md"
authors = [
    { name = "Gurnaud", email = "ishemagurnaud0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi-cache2[redis]>=0.2.2",
    "fastapi[standard]>=0.142.4",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=4.6.0",
    "sanity>=0.2.5",
    "sqlalchemy>=2.1.4",
    "typing>=3.10.0.0",
]

[project.scripts]
imenanewsbox-api = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
