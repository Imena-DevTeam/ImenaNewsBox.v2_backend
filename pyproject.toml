[project]
name = "imenanewsbox-api"
version = "0.1.0"
description = "The API for the Imena News Box project."
readme = "README.md"
authors = [
    { name = "Gurnaud", email = "ishemagurnaud0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cachetools>=7.2.1",
    "cloudinary>=1.46.3",
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
]

[project.scripts]
imenanewsbox-api = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-cachetools>=7.0.0.20260713",
]
import = [
    "pymongo>=4.18.3",
]
