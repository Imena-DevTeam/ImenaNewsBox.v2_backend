[project]
name = "imenanewsbox-api"
version = "0.1.0"
description = "The API for the Imena News Box project."
readme = "README.md"
authors = [
    { name = "Gurnaud", email = "ishemagurnaud0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cachetools>=7.2.1",
    "cloudinary>=1.46.3",
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-cachetools>=7.0.0.20260713",
]
import = [
    "pymongo>=4.18.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "ASYNC", # blocking calls inside async code
    "SIM",   # flake8-simplify
    "PLE",   # pylint errors
    "PLW",   # pylint warnings (e.g. `super.__init__` without parentheses)
    "RUF",   # ruff-specific checks
]

[tool.pytest.ini_options]
# Feature tests live in src/app/<feature>/tests/; cross-feature tests in tests/.
# importlib mode lets several features each have a test_service.py without
# needing __init__.py files in the test folders.
testpaths = ["src", "tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# The Cloudinary SDK ships no type hints; only core/media.py (and its tests) import it.
module = ["cloudinary", "cloudinary.*"]
ignore_missing_imports = true
